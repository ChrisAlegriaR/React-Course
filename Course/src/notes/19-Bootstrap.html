<!-- ^Bootstrap. -->
<!-- ^Bootstrap es un framework de CSS que nos permite crear páginas web de manera rápida y sencilla, ya que nos proporciona una gran cantidad de clases predefinidas que podemos utilizar para darle estilo a nuestros componentes de React. Además de esto, Bootstrap nos proporciona una gran cantidad de componentes predefinidos que podemos utilizar para crear nuestra página web, como botones, formularios, tablas, modales, tarjetas, sistemas de navegación, entre otros. Por lo que se puede decir que Bootstrap es un framework de CSS y JavaScript que nos permite crear páginas web de manera rápida y sencilla, aprovechando estilos, utilidades y componentes que ya han sido desarrollados previamente. Además de esto, Bootstrap es un framework responsive, lo que significa que proporciona herramientas y clases que permiten adaptar nuestra página web a diferentes tamaños de pantalla, como teléfonos móviles, tablets y computadoras de escritorio. Por lo que es importante mencionar que para utilizar Bootstrap en nuestro proyecto de React, es necesario instalarlo mediante npm, ya que esto nos permitirá utilizar las clases y componentes predefinidos de Bootstrap dentro de nuestros componentes de React. Por otro lado, también podemos utilizar Bootstrap mediante un enlace <link> o un script que apunte a la versión de Bootstrap que queremos utilizar, como veremos en este ejemplo mediante un CDN. Esta alternativa permite cargar Bootstrap directamente desde un servidor externo sin instalar el paquete dentro de nuestro proyecto. Sin embargo, cuando trabajamos con un proyecto de React administrado mediante npm, normalmente es recomendable instalar Bootstrap mediante npm, ya que de esta manera Bootstrap forma parte de las dependencias del proyecto y podemos controlar la versión que utilizamos desde nuestro package.json. Para su instalación directa en el proyecto solamente es necesario ejecutar el siguiente comando en la terminal de nuestro proyecto de React: npm install bootstrap. Una vez instalado Bootstrap, es necesario importarlo en nuestro archivo main.jsx, para esto es necesario agregar la siguiente línea de código al inicio del archivo main.jsx: import 'bootstrap/dist/css/bootstrap.min.css'; Con esto ya podemos utilizar las clases y estilos predefinidos de Bootstrap en nuestros componentes de React. -->

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> <!-- *Se integra el enlace de Bootstrap mediante un CDN (Content Delivery Network), permitiendo cargar la hoja de estilos CSS de Bootstrap directamente desde un servidor externo. La versión utilizada en este caso es Bootstrap 5.3.8 y el archivo cargado corresponde a los estilos CSS principales del framework. Gracias a este enlace podemos utilizar las clases predefinidas de Bootstrap, como las clases para colores, márgenes, tamaños, distribución, botones, formularios y diseño responsive, sin necesidad de instalar Bootstrap mediante npm. El atributo integrity permite verificar que el archivo descargado desde el CDN coincida con el contenido esperado, mientras que crossorigin="anonymous" permite realizar esta carga como un recurso externo sin enviar credenciales. -->

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>React Course</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" esto mantenloi tal cual solo agrega comentarios a donde estas el link uy el script de bootstrap y eso crossorigin="anonymous"></script> <!-- *Se integra el archivo JavaScript de Bootstrap mediante un CDN. Este archivo contiene la funcionalidad interactiva de los componentes de Bootstrap que necesitan JavaScript para funcionar, como los modales, menús desplegables, carruseles, tooltips y otros componentes interactivos. En este caso se utiliza bootstrap.bundle.min.js, que incluye Bootstrap junto con sus dependencias necesarias, como Popper, para que determinados componentes puedan funcionar correctamente. Al igual que con el enlace CSS anterior, el atributo integrity permite verificar la integridad del recurso descargado y crossorigin="anonymous" indica cómo debe realizarse la solicitud del recurso externo. -->
    </body>
</html>
