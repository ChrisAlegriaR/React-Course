<!-- ^index.html -->
<!-- ^El archivo index.html en la carpeta raiz de nuestor proyecto, es el punto de entrada de la aplicacion. Donde React por ende trabaj con un archivo de enbtrada. Una de las caracteristicas de el archivo de entrada index.html dentro de React es que es el ÚNICO archivo HTML de toda la aplicación. A diferencia del desarrollo web tradicional donde tienes que redireccionar saltando de un archivo HTML a otro (como contacto.html), en React nunca cambias de página. Lo único que hacemos es quitar y poner (sustituir) componentes de JavaScript que retornan código JSX dentro de este mismo archivo, simulando una navegación instantánea. Por lo que para esto React necesita un archivo HTML de entrada que contenga un div con un id específico, en este caso "root, ademas para la sustitución de componentes es necesario que el archivo de entrada tenga un script que apunte a un archivo de JavaScript que contenga la lógica de React, en este caso main.jsx, en el cual dentro de este archivo se importan los componentes de React y se renderizan dentro del div con id "root", por lo que en raras ocaciones este archivo se modifica, ya que la mayor parte del trabajo se hace en los componentes de React. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Course</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
